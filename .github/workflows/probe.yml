name: Sonde sources parts de marché
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Texte du communiqué
        run: |
          curl -sS -L -m 30 -A "Mozilla/5.0 (compatible; AIRadar/1.0)" -o tf.html "https://www.trendforce.com/presscenter/news/20260909-13225.html"
          python3 - <<'PY'
          import re
          h=open("tf.html",encoding="utf8",errors="ignore").read()
          h=re.sub(r"<script[\s\S]*?</script>|<style[\s\S]*?</style>"," ",h)
          t=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",h))
          i=t.find("TrendForce’s latest foundry")
          if i<0: i=t.find("TSMC maintained")-300
          print("TEXTE:",t[i:i+3800])
          PY

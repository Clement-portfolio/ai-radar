name: Sonde sources de séries
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: BTOS xlsx
        run: |
          curl -sS -L -m 60 -A "Mozilla/5.0 (compatible; AIRadar/1.0)" -o National.xlsx "https://www.census.gov/hfp/btos/downloads/National.xlsx"
          pip install -q openpyxl 2>&1 | tail -1
          python3 - <<'PY'
          import openpyxl
          wb=openpyxl.load_workbook("National.xlsx",read_only=True,data_only=True)
          print("SHEETS",wb.sheetnames)
          for ws in wb.worksheets:
              print("SHEET",ws.title,ws.max_row,ws.max_column)
              for i,row in enumerate(ws.iter_rows(values_only=True)):
                  if i<3: print("ROW",ws.title,i,[str(c)[:40] for c in row[:8]], "...", [str(c)[:12] for c in row[-3:]])
          for ws in wb.worksheets:
              for i,row in enumerate(ws.iter_rows(values_only=True)):
                  t=" ".join(str(c) for c in row[:3] if c is not None)
                  if "Artificial" in t or "AI" in t.split() or "Question ID" in t:
                      print("AIROW",ws.title,i,[str(c)[:60] for c in row[:6]], "LAST", [str(c)[:8] for c in row[-4:]])
          PY

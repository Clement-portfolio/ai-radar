name: Sonde sources de séries
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: BTOS xlsx
        run: |
          curl -sS -L -m 60 -A "Mozilla/5.0 (compatible; AIRadar/1.0)" -o National.xlsx "https://www.census.gov/hfp/btos/downloads/National.xlsx"
          pip install -q openpyxl 2>&1 | tail -1
          python3 - <<'PY'
          import openpyxl
          wb=openpyxl.load_workbook("National.xlsx",read_only=True,data_only=True)
          ws=wb["Response Estimates"]
          rows=list(ws.iter_rows(values_only=True))
          hdr=rows[0]
          seen=set()
          for r in rows[1:]:
              if r[0] not in seen:
                  seen.add(r[0]); print("Q",r[0],str(r[1])[:230])
          for r in rows[1:]:
              if r[3]=="Yes" and r[1] and ("Intelligence" in str(r[1]) or " AI" in str(r[1])):
                  print("SERIES",r[0],str(r[1])[:90],"|",[(hdr[i],r[i]) for i in range(4,len(r)) if r[i] not in (None,".")][:3],"...",[(hdr[i],r[i]) for i in range(4,len(r)) if r[i] not in (None,".")][-3:])
          dates=list(wb["Collection and Reference Dates"].iter_rows(values_only=True))
          for d in dates[:2]+dates[-3:]: print("DATES",d[:9])
          PY

name: Sonde sources parts de marché
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lecture réelle (sans écriture)
        run: |
          node -e '
          import("./collector/shares.mjs").then(async (m) => {
            const fs = await import("node:fs");
            const prev = JSON.parse(fs.readFileSync("public/data/shares.json", "utf8"));
            for (const c of prev.charts) delete c.attempted_at;
            prev.charts.find((c) => c.id === "foundry").period_key = "2026Q1";
            const r = await m.collectShares({ prev, now: Date.now(), log: console.log });
            console.log("RESUME", JSON.stringify(r.summary));
            for (const c of r.doc.charts.filter((x) => x.auto)) console.log("CHART", c.id, c.period, JSON.stringify(c.segments), c.url, c.check_error || "");
          });
          '

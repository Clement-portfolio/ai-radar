name: Flux rapide — actualités

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "collector/fast.mjs"
      - ".github/workflows/fast-collect.yml"

concurrency:
  group: fast-collect
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecte RSS légère
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node collector/fast.mjs
      - name: Publier le flux rapide
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add public/data/fast-feed.json public/data/fast-translation.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Flux rapide — actualités"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

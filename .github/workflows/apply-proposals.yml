name: Appliquer les propositions de revue

# Déclenché par un commentaire « /appliquer 1 3 » (ou « /appliquer tout ») du propriétaire sur l'issue de revue du robot.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: appliquer-propositions
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      contains(github.event.issue.labels.*.name, 'revue-hebdo') &&
      startsWith(github.event.comment.body, '/appliquer')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Appliquer
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RESULT_FILE: ${{ runner.temp }}/apply-result.md
        run: node collector/apply-proposals.mjs
      - name: Publier les données
        if: steps.apply.outputs.changed != '0'
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add public/data
          git commit -m "Revue hebdomadaire : propositions validées (issue #${{ github.event.issue.number }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Répondre sur l'issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body-file "${{ runner.temp }}/apply-result.md"

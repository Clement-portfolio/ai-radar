name: Collecte approfondie — Actualités, Recherche et Insiders Presse (3 h)

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "!collector/fast-voix.mjs"
      - ".github/workflows/collect.yml"
  pull_request:
    paths:
      - "collector/**"
      - "!collector/fast-voix.mjs"
      - ".github/workflows/collect.yml"

concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests hors ligne
        run: |
          node collector/test.mjs
          node collector/test-x.mjs
          node collector/test-voix.mjs

  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecte approfondie
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          GDELT_TIMESPAN: ${{ github.event_name == 'schedule' && '3h' || '1d' }}
          MAX_AGE_DAYS: ${{ github.event_name == 'schedule' && '3' || '7' }}
        run: node collector/collect.mjs
      - name: Probabilités du calendrier
        continue-on-error: true
        run: node collector/calendar.mjs
      - name: Enregistrer les données
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

name = "whats-going-on"
main = "worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# Ces chemins passent d'abord par le Worker ; le reste est servi directement (pages, scripts, images).
run_worker_first = ["/data/*", "/go", "/healthz", "/img/actors/*"]
